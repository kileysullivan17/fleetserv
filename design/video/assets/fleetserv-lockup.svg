    <g transform="skewX(-16)">
      <rect x="0" y="0" width="22" height="52" rx="3" fill="#22B597"/>
      <rect x="28" y="0" width="22" height="52" rx="3" fill="#102A40"/>
    </g>
  </g>
  <text x="92" y="52" font-family="Archivo" font-weight="800" font-style="italic"
        font-size="64" letter-spacing="2.4" fill="#102A40">FLEETSERV</text>
</svg>
