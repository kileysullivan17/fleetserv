<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 60" width="2000" height="171">
  <!-- Full FleetServ logo lockup: skewed teal+navy bars + FLEETSERV wordmark (Archivo 800 italic).
       Matches src/components/ui/BrandMark.tsx. Transparent background, for light surfaces. -->
