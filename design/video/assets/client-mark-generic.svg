<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="1024" height="1024">
  <!-- GENERIC / PLACEHOLDER client mark. Invented company ("Ironwood Freight"). Deliberately far
       from FleetServ: warm rust (not navy/teal), a solid round badge (not floating skewed bars),
       and an upright bold monogram (not an italic wordmark). Not a real business. Swap this file
       if you brand the driver with an actual (permissioned) client logo. -->
  <circle cx="160" cy="160" r="152" fill="#A8432A"/>
  <circle cx="160" cy="160" r="140" fill="none" stroke="#F2E7D6" stroke-width="5"/>
  <text x="160" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="150" letter-spacing="2" fill="#F2E7D6">IW</text>
  <text x="160" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="26" letter-spacing="6" fill="#F2E7D6">IRONWOOD</text>
</svg>
