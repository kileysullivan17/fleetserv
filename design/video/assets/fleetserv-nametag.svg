<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="1760" height="600">
  <!-- Tech chest name patch: cream embroidered rounded rectangle, navy border, FleetServ bars +
       wordmark (Archivo 800 italic), amber rule, and a name line. Change the name ("KAI"). -->
  <rect x="4" y="4" width="432" height="142" rx="18" fill="#F7F1E4" stroke="#102A40" stroke-width="6"/>
  <!-- skewed bars, left -->
  <g transform="translate(30,46)">
    <g transform="skewX(-16)">
      <rect x="0" y="0" width="18" height="56" rx="3" fill="#22B597"/>
      <rect x="24" y="0" width="18" height="56" rx="3" fill="#102A40"/>
    </g>
  </g>
  <text x="112" y="66" font-family="Archivo" font-weight="800" font-style="italic"
        font-size="34" letter-spacing="1.4" fill="#102A40">FLEETSERV</text>
  <rect x="112" y="82" width="286" height="4" rx="2" fill="#C7860F"/>
  <text x="112" y="118" font-family="Archivo" font-weight="700"
        font-size="26" letter-spacing="3" fill="#102A40">KAI</text>
</svg>
