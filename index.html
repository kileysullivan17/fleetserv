<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the stored theme before first paint, so a dark choice never
         flashes light. Mirrors src/lib/theme.ts; no stored value means System,
         which tokens.css handles with prefers-color-scheme. -->
    <script>
      try {
        var t = localStorage.getItem("fleetserv.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>
    <title>FleetServ Hawaii</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Splash: logo, line and a loading bar for 2s on the first open in a
         browser session, then the app. Skipped on reloads in the same session,
         on any deep link (a path other than / or a query string), and by any
         tap or key. Reduced motion: no fade or sweep. Markup and script sit
         at the top of <body>; the script un-hides it before first paint.
         Navy-950 ground in both themes (the sidebar color), so the white band in the mark never washes out. Teal-500 only on navy, per tokens.css. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center;
        transition: opacity 0.36s ease, visibility 0s linear 0.36s; }
      #splash[hidden] { display: none; }
      #splash.is-leaving { opacity: 0; visibility: hidden; }
      #splash .splash-logo { display: block; width: min(78vw, 360px); height: auto; }
      #splash .splash-line { margin: 0; max-width: 22em; }
      #splash .splash-bar { position: relative; width: min(62vw, 280px); height: 4px; overflow: hidden; }
      #splash .splash-bar i { position: absolute; inset: 0; transform-origin: left; animation: splash-sweep 1.4s ease-in-out 0.16s both; }
      #splash .splash-mark, #splash .splash-line { animation: splash-in 0.4s ease-out both; }
      #splash .splash-line { animation-delay: 0.2s; }
      @keyframes splash-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes splash-sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash .splash-mark, #splash .splash-line, #splash .splash-bar i { animation: none; transition: none; }
      }
      #splash { background: #0b1b2a; color: #d9e4ee; }
      #splash .splash-line { font: 500 16px/1.35 "Archivo", system-ui, sans-serif; }
      #splash .splash-bar { background: rgba(217, 228, 238, 0.18); }
      #splash .splash-bar i { background: #22b597; }
    </style>
  </head>
  <body>

      <p class="splash-line">Inspection first, invoice last.</p>
      <div class="splash-bar"><i></i></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        var key = 'fleetserv.splashSeen';
        var seen = false;
        try { seen = sessionStorage.getItem(key) === '1'; sessionStorage.setItem(key, '1'); } catch (e) {}
        if (seen || location.pathname !== '/' || location.search) return;
        el.hidden = false;
        var done = false;
        function leave() {
          if (done) return;
          done = true;
          el.classList.add('is-leaving');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
          window.removeEventListener('pointerdown', leave);
          window.removeEventListener('keydown', leave);
        }
        window.addEventListener('pointerdown', leave);
        window.addEventListener('keydown', leave);
        setTimeout(leave, 2000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
